<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lightsaber — Output</title>
<link rel="icon" type="image/svg+xml" href="/static/lightsaber.svg">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;
            cursor:none}
  canvas{display:block;width:100vw;height:100vh}
  #hint{position:fixed;left:0;right:0;bottom:24px;text-align:center;
        font:13px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#5a5f6b;
        opacity:1;transition:opacity 1.5s ease-out;pointer-events:none;user-select:none}
  #hint.gone{opacity:0}
  #status{position:fixed;left:0;right:0;top:24px;text-align:center;
          font:13px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#a04040;
          display:none;pointer-events:none;user-select:none}
  #status.show{display:block}
</style>
</head>
<body>
<canvas id="out"></canvas>
<div id="hint">Lightsaber output — drag this window to your projector/second screen, then press F11 for fullscreen</div>
<div id="status">disconnected — retrying…</div>
<script>
const cv = document.getElementById("out"), cx = cv.getContext("2d");
const statusEl = document.getElementById("status");
const hintEl = document.getElementById("hint");

// ResizeObserver, not just a window "resize" listener (4) — a real popped-
// out window always fires "resize" on its own resizes, but this page is now
// ALSO embedded in a small <iframe> (the control page's output-preview
// panel — see isPreview below): an iframe whose parent tab starts
// display:none has a 0×0 layout box at load, and switching that tab back to
// visible doesn't reliably fire the iframe's own "resize" event in every
// browser, leaving cv.width/height stuck at 0 forever (drawImage then
// throws on a 0-sized source). ResizeObserver fires for ANY box-size
// change, ancestor-visibility-driven or not — same fix as index.html's
// cv-edit already uses for its own equivalent embedding-in-a-tab problem.
function resize(){
  const dpr = window.devicePixelRatio || 1;
  const w = Math.round(document.documentElement.clientWidth * dpr);
  const h = Math.round(document.documentElement.clientHeight * dpr);
  if (w > 0 && h > 0 && (cv.width !== w || cv.height !== h)){ cv.width = w; cv.height = h; }
}
new ResizeObserver(resize).observe(document.documentElement);
resize();

const outputId = new URLSearchParams(location.search).get("out") || "1";
// Preview mode (?preview=1) — the control page's own output-preview panel
// (Sequencer tab) embeds this exact page in a small <iframe> per output, so
// it always shows precisely what that output is doing (flip/keystone/test
// pattern all included, for free) without a second render implementation.
// The "drag this window…" hint only makes sense for a real popped-out
// window, so skip it outright here instead of just letting it fade.
const isPreview = new URLSearchParams(location.search).get("preview") === "1";
document.title = `Lightsaber — Output ${outputId}`;
if (isPreview){
  hintEl.remove();
} else {
  setTimeout(() => hintEl.classList.add("gone"), 4000);
  hintEl.textContent = `Lightsaber output ${outputId} — drag this window to your projector/second screen, then press F11 for fullscreen`;
}

// Monitor-only visual filters — pure canvas rendering, no effect on the
// vector data. glow/trail/mirror are per-POLYGON now (see composite.py's
// overrides, carried on each layer in the composite payload itself), not a
// window-level setting read from here any more. flip is different: a
// per-OUTPUT-MONITOR physical-orientation setting, keyed by this window's
// own `?out=` id, that has nothing to do with any scene/polygon. Lives on
// the PROJECT now (Project tab > Output monitors — see projects.py's
// OutputMonitorConfig), not browser localStorage: a rig's physical
// orientation belongs to the show, and needs to reach this window
// regardless of which browser/machine opened it, not just tabs sharing one
// browser's storage. Updated from the SAME state broadcast that drives
// paintComposite (see the ws.onmessage handler below), not a separate poll.
// Viewport (a crop rect into the full canvas, [0,1] fractions, top-left
// origin — see projects.py's OutputMonitorConfig) — which slice of the
// canvas THIS output shows, for a wide multi-projector canvas sliced across
// several physical outputs (see ARCHITECTURE.md's render-host topology).
// Only applied when state.viewports_enabled is true; otherwise every
// output always shows the full canvas, unconditionally — the original
// behaviour, still the default even on projects that have viewport values
// sitting on them from before this existed. duplicate_of resolves to
// ANOTHER output's viewport (not this one's own) — flip/keystone above
// stay independent regardless, only the crop rect is shared.
const filters = { flipX: false, flipY: false, keystoneH: 0, keystoneV: 0, viewport: null };
function resolveViewport(outputs, index){
  let cfg = outputs[index], guard = 0;
  while (cfg && cfg.duplicate_of != null && guard++ < 8) cfg = outputs[cfg.duplicate_of];
  if (!cfg) return null;
  return { x: cfg.viewport_x ?? 0, y: cfg.viewport_y ?? 0, w: cfg.viewport_w ?? 1, h: cfg.viewport_h ?? 1 };
}
function applyOutputFilters(state){
  const outputs = (state && state.outputs) || [];
  const idx = (+outputId || 1) - 1;
  const cfg = outputs[idx] || {};
  filters.flipX = !!cfg.flip_x;
  filters.flipY = !!cfg.flip_y;
  filters.keystoneH = cfg.keystone_h ?? 0;
  filters.keystoneV = cfg.keystone_v ?? 0;
  filters.viewport = (state && state.viewports_enabled) ? resolveViewport(outputs, idx) : null;
}
// Remaps a normalized [-1,1] (Y-up) canvas coordinate so the viewport rect
// fills the whole [-1,1] range instead of the full canvas — everything
// outside the viewport lands outside [-1,1] and is naturally clipped by the
// canvas element's own bounds (nothing special needed for that part).
function applyViewport(x, y, vp){
  if (!vp) return [x, y];
  const fx = (x + 1) / 2, fy = (1 - y) / 2;
  const mfx = (fx - vp.x) / vp.w, mfy = (fy - vp.y) / vp.h;
  return [mfx * 2 - 1, 1 - mfy * 2];
}

// Per-output-monitor keystone correction — display-only, this window's own
// physical-mount compensation (Project tab > Output monitors).
function applyKeystone(x, y, kh, kv){
  const xk = x * (1 + kh * y);
  const yk = y * (1 + kv * xk);
  return [Math.max(-1, Math.min(1, xk)), Math.max(-1, Math.min(1, yk))];
}

// Reverses the WHOLE image, no reflection — the per-output-monitor "flip"
// (Project tab > Output monitors). Unlike per-polygon mirror (a same-shape
// axis flip applied to each layer's own strokes before warping, see
// paintComposite), this runs the finished composited frame through a
// physical-orientation correction for this specific screen.
function applyFlip(ctx, canvas, flipX, flipY){
  const w = canvas.width, h = canvas.height;
  ctx.save();
  ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = "source-over";
  ctx.translate(flipX ? w : 0, flipY ? h : 0);
  ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
  ctx.drawImage(canvas, 0, 0, w, h);
  ctx.restore();
}

// Unit-square->quad homography — identical to index.html's canvas editor
// (see its comment for the derivation); kept in sync so this window warps
// each polygon exactly the way the editor previews it.
function homography(corners){
  const [[x0,y0],[x1,y1],[x2,y2],[x3,y3]] = corners;
  const dx1=x1-x2, dy1=y1-y2, dx2=x3-x2, dy2=y3-y2;
  const sx=x0-x1+x2-x3, sy=y0-y1+y2-y3;
  const den = dx1*dy2 - dx2*dy1;
  const g = den ? (sx*dy2 - dx2*sy)/den : 0;
  const h = den ? (dx1*sy - sx*dy1)/den : 0;
  return { a: x1-x0+g*x1, b: x3-x0+h*x3, c: x0, d: y1-y0+g*y1, e: y3-y0+h*y3, f: y0, g, h };
}
function applyHomography(H, gx, gy){
  const u = (gx+1)/2, v = (1-gy)/2;
  const W = H.g*u + H.h*v + 1;
  return W ? [(H.a*u+H.b*v+H.c)/W, (H.d*u+H.e*v+H.f)/W] : [H.a*u+H.b*v+H.c, H.d*u+H.e*v+H.f];
}

function polygonBBoxPx(corners, mapWin){
  const pts = corners.map(c => mapWin(c[0], c[1]));
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  return {
    cx: (Math.min(...xs)+Math.max(...xs))/2, cy: (Math.min(...ys)+Math.max(...ys))/2,
    rx: Math.max(1,(Math.max(...xs)-Math.min(...xs))/2), ry: Math.max(1,(Math.max(...ys)-Math.min(...ys))/2),
  };
}

// Shape fit (1) — identical maths to index.html's canvas editor; see its
// comment for the derivation. Only difference here is quadAspect uses this
// window's own letterboxed mapWin instead of a plain square normToPx.
function parseAspectRatio(str){
  const m = /^(\d+(?:\.\d+)?):(\d+(?:\.\d+)?)$/.exec(String(str||"").trim());
  if (!m) return 1;
  const w = parseFloat(m[1]), h = parseFloat(m[2]);
  return h > 0 ? w/h : 1;
}
function quadAspect(corners, mapWin){
  const pts = corners.map(c => mapWin(c[0], c[1]));
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  const qw = Math.max(...xs)-Math.min(...xs), qh = Math.max(...ys)-Math.min(...ys);
  return qh > 0 ? qw/qh : 1;
}
function fitPoint(gx, gy, mode, ca, qa){
  if (mode === "fit"){
    return ca >= qa ? [gx, gy * (qa/ca)] : [gx * (ca/qa), gy];
  }
  if (mode === "crop"){
    return ca >= qa ? [gx * (ca/qa), gy] : [gx, gy * (qa/ca)];
  }
  return [gx, gy];
}
function clipToQuadPath(ctx, corners, mapWin){
  ctx.beginPath();
  corners.forEach((c,i) => { const [X,Y]=mapWin(c[0],c[1]); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
  ctx.closePath();
  ctx.clip();
}
function clipShapePath(ctx, shape, cx, cy, rx, ry){
  ctx.beginPath();
  if (shape === "circle") {
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
  } else if (shape === "square") {
    ctx.rect(cx-rx, cy-ry, rx*2, ry*2);
  } else if (shape === "triangle") {
    ctx.moveTo(cx, cy-ry); ctx.lineTo(cx+rx, cy+ry); ctx.lineTo(cx-rx, cy+ry); ctx.closePath();
  } else if (shape === "hexagon") {
    for (let i=0;i<6;i++){
      const a = -Math.PI/2 + i*Math.PI/3;
      const x = cx+rx*Math.cos(a), y = cy+ry*Math.sin(a);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath();
  }
}

// Custom mask (8) — clip_shape="custom"'s point list, in the quad's own UV
// space ([0,1]^2). Mapped through the same homography as the content, so
// the silhouette warps with the corner pins instead of sitting still in
// screen space. Mirrors index.html's block of the same name — see there,
// and PolygonSpec.clip_points, for the full rationale.
const CLIP_PRESETS = ["circle", "hexagon", "triangle", "square"];
const DEFAULT_CLIP_POINTS = [[0,0],[1,0],[1,1],[0,1]];
function polyClipPoints(layer){
  const pts = layer.clip_points;
  return (Array.isArray(pts) && pts.length >= 3) ? pts : DEFAULT_CLIP_POINTS;
}
function hasCustomMask(layer){
  return layer.clip_shape === "custom" && (layer.corners || []).length === 4;
}
function customMaskPath(ctx, layer, H, mapWin){
  ctx.beginPath();
  polyClipPoints(layer).forEach((p, i) => {
    const [nx, ny] = applyHomography(H, p[0]*2-1, 1-p[1]*2);
    const [X, Y] = mapWin(nx, ny);
    i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
  });
  ctx.closePath();
}
// Guards the degenerate case (clip_shape "custom" on a shape without a real
// quad) that would otherwise clip to an empty path and blank the shape out.
function polyClipActive(layer){
  return hasCustomMask(layer) || CLIP_PRESETS.includes(layer.clip_shape);
}
function polyClipPath(ctx, layer, corners, mapWin){
  if (hasCustomMask(layer)){ customMaskPath(ctx, layer, homography(corners), mapWin); return; }
  const {cx, cy, rx, ry} = polygonBBoxPx(corners, mapWin);
  const s = layer.clip_scale ?? 1;
  clipShapePath(ctx, layer.clip_shape, cx, cy, rx*s, ry*s);
}

// Mirror-point fold — identical maths to index.html's foldFraction/foldG
// (see its comment for the full rationale): keeps [0,point] as-is and
// mirrors it to fill [point,1], clamping once the source region runs out
// rather than tiling. point=1 is a no-op (the "off" default).
function foldFraction(u, point){
  if (point >= 0.999) return u;
  return u <= point ? u : Math.max(0, 2*point - u);
}
function foldG(g, point){
  if (point >= 0.999) return g;
  return foldFraction(g*0.5+0.5, point)*2 - 1;
}
// Draws one polygon's warped strokes (incl. glow) into `ctx` — identical
// structure to index.html's canvas editor, just using this window's own
// letterboxed mapWin instead of a plain square normToPx.
function drawWarpedStrokes(ctx, w, h, layer, H, mapWin, opacity, fitMode, ca, qa){
  ctx.save();
  ctx.globalAlpha = opacity;
  const glowPx = (layer.glow || 0) * Math.min(w, h) * 0.05;
  const preFold = layer.mirror_pre_distort ?? true;
  const mxPoint = preFold ? (layer.mirror_x_point ?? 1) : 1;
  const myPoint = preFold ? (layer.mirror_y_point ?? 1) : 1;
  layer.strokes.forEach(st => {
    const [r, g, b] = st.c;
    const col = `rgb(${r*255|0},${g*255|0},${b*255|0})`;
    ctx.strokeStyle = col;
    ctx.shadowBlur = glowPx > 0 ? glowPx : 0;
    ctx.shadowColor = col;
    ctx.lineWidth = Math.max(1, Math.min(w,h) / 520);
    ctx.lineJoin = "round";
    ctx.beginPath();
    st.p.forEach((pt, i) => {
      let [gx, gy] = pt;
      if (layer.mirror_x) gx = -gx;
      if (layer.mirror_y) gy = -gy;
      gx = foldG(gx, mxPoint); gy = foldG(gy, myPoint);
      [gx, gy] = fitPoint(gx, gy, fitMode, ca, qa);
      const [wx, wy] = applyHomography(H, gx, gy);
      const [X, Y] = mapWin(wx, wy);
      i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
    });
    ctx.stroke();
  });
  ctx.restore();
}
// Clip Shape (4) — hard-edged only now, same as index.html's drawClippedStrokes:
// Canvas 2D's own clip() does this directly, no offscreen canvas/blur (used
// to support a soft/feathered edge, but that was expensive enough to
// visibly stall the render loop with more than a couple of clipped shapes).
function drawClippedStrokes(ctx, w, h, layer, H, mapWin, opacity, fitMode, ca, qa){
  ctx.save();
  polyClipPath(ctx, layer, layer.corners, mapWin);
  ctx.clip();
  drawWarpedStrokes(ctx, w, h, layer, H, mapWin, opacity, fitMode, ca, qa);
  ctx.restore();
}

// Builds the ctx.filter string from a layer's fields — identical logic to
// index.html's buildCssFilter (see its comment for the colourize
// sepia()+hue-rotate() rationale); layer.* here has the same field names as
// poly.overrides there, since composite.py copies overrides straight
// through onto the broadcast layer dict.
function buildCssFilter(f){
  const parts = [];
  const b = f.brightness ?? 1, c = f.contrast ?? 1, h = f.hue ?? 0, sat = f.saturation ?? 1;
  const colAmt = f.colourize_amount ?? 0, colHue = f.colourize_hue ?? 0;
  if (b !== 1) parts.push(`brightness(${b})`);
  if (c !== 1) parts.push(`contrast(${c})`);
  if (sat !== 1) parts.push(`saturate(${sat})`);
  if (h !== 0) parts.push(`hue-rotate(${h}deg)`);
  if (colAmt > 0) parts.push(`sepia(${colAmt}) saturate(${1 + colAmt}) hue-rotate(${colHue - 50}deg)`);
  return parts.length ? parts.join(" ") : "none";
}

// Knockout fill type (2/3) — a boolean cutout: opaque black fill, no scene
// content, no homography warp (already screen-space geometry via mapWin),
// arbitrary point count. No outline here (unlike the editor) — this is the
// real projected output, so it should be invisible other than blocking
// whatever's behind it.
function drawKnockoutFill(ctx, layer, mapWin, opacity){
  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.fillStyle = "#000";
  ctx.beginPath();
  layer.corners.forEach((c,i) => { const [X,Y]=mapWin(c[0],c[1]); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// Media shapes — same idea as index.html's drawPolyMedia (see its comments
// for the full rationale, including the perf technique below), using this
// window's own mapWin instead of a rect. Kept in sync with the editor's
// version by hand, same as every other paired function in this file.
//
// Playback: videos load with autoplay OFF, and only actually play while the
// engine is active and not frozen (updateMediaPlayback, driven by the
// websocket's own state messages below) — same "doesn't play until Start"
// behaviour as the editor. Unlike the editor though, this window does NOT
// draw a media layer at all while inactive (see paintComposite's `active`
// check) — matching how vector scenes already go fully black on Stop here,
// rather than showing a static preview frame (that's an editing aid, this
// is the real output).
const _mediaEls = new Map();
const _MEDIA_VIDEO_EXT = new Set(["mp4","mov","webm","m4v","mkv","avi","ogv"]);
// Media source descriptors — a shape's content is either a file uploaded
// into the app's own media/ library (poly.media, a bare filename) or a LINK
// to a file where it already lives (poly.media_link, "<root>::<rel/path>" —
// see media_roots.py). Both collapse to one cache key + one URL here so the
// rest of the draw path never has to care which kind it is. A link wins when
// both are set, matching the compositor's own precedence.
function mediaRefFor(p){
  if (p.media_link) return {key: "link:" + p.media_link, link: p.media_link,
                            name: p.media_link.split("::").pop().split("/").pop()};
  if (p.media) return {key: "lib:" + p.media, name: p.media};
  return null;
}
function mediaUrlFor(ref){
  if (ref.link){
    const [root, rel] = [ref.link.slice(0, ref.link.indexOf("::")),
                         ref.link.slice(ref.link.indexOf("::") + 2)];
    // Per-segment encoding: the route's tail is a path, so "/" must survive
    // while spaces/#/? in a folder or file name must not.
    const tail = rel.split("/").map(encodeURIComponent).join("/");
    return `/media-link/${encodeURIComponent(root)}/${tail}`;
  }
  return `/media-files/${encodeURIComponent(ref.name)}`;
}

// Server-driven playhead (item 15) — composite.py computes where each media
// shape should be (layer.media_t) from the canvas clock, and every client
// converges on it rather than letting its own <video> free-run. Without
// this, the editor and each output window drift apart within seconds, so a
// clip spanning two projectors through a viewport crop would show a
// different frame on each screen.
//
// Correction is a nudge, not a per-frame seek: seeking a 30-minute file is
// expensive, so the element plays normally and is only pulled back when it
// has genuinely drifted (or when the trim loops, which reads as a big jump).
const MEDIA_DRIFT_TOLERANCE = 0.25;   // seconds
function syncMediaTime(m, layer){
  if (!m || m.kind !== "video" || !m.ready || !layer) return;
  const target = layer.media_t;
  if (target == null) return;          // duration unknown — let it play
  const el = m.el;
  const rate = layer.media_rate || 1;
  if (el.playbackRate !== rate) el.playbackRate = rate;
  if (m.seeking) return;
  if (Math.abs(el.currentTime - target) > MEDIA_DRIFT_TOLERANCE){
    m.seeking = true;
    try { el.currentTime = target; } catch (e) { m.seeking = false; }
  }
}
// Duration is measured here (the server never opens the file) and reported
// once per asset, so the trim UI has a timeline to draw without re-probing.
const _durationReported = new Set();
function reportMediaDuration(assetKey, el){
  const d = el.duration;
  if (!(d > 0) || d === Infinity || _durationReported.has(assetKey)) return;
  _durationReported.add(assetKey);
  fetch("/media/meta/duration", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({key: assetKey, duration: d})}).catch(() => {});
}

// Cache eviction (item 15) — the cache key includes the playback config, so
// every trim edit mints a NEW entry and orphans the old one. Without a sweep
// those orphans keep decoding forever (nudging an in-point a few times would
// leave several 4K decoders running), and a stale element can even be found
// ahead of the live one when debugging. Anything not drawn for a few seconds
// is released; it reloads on demand if it comes back.
let _mediaFrame = 0;
const _MEDIA_EVICT_AFTER = 60;   // ticks (~3s at 20fps)
function evictUnusedMedia(){
  for (const [key, m] of _mediaEls){
    if (_mediaFrame - (m.lastUsed || 0) <= _MEDIA_EVICT_AFTER) continue;
    try {
      if (m.kind === "video"){ m.el.pause(); m.el.removeAttribute("src"); m.el.load(); }
    } catch (e) {}
    _mediaEls.delete(key);
  }
}
function getMediaEl(ref, layer){
  // Keyed by asset AND playback config: two shapes trimmed/moded identically
  // share one decoder and stay frame-identical (what happened before this
  // existed), while shapes with different in/out get their own playhead.
  // That bounds decoder count to distinct CONFIGURATIONS, not shape count.
  const cfg = (layer && layer.media_cfg) || "";
  const cacheKey = ref.key + "|" + cfg;
  let m = _mediaEls.get(cacheKey);
  if (m){ m.lastUsed = _mediaFrame; return m; }
  const ext = (ref.name.split(".").pop() || "").toLowerCase();
  const kind = _MEDIA_VIDEO_EXT.has(ext) ? "video" : "image";
  const url = mediaUrlFor(ref);
  let el;
  if (kind === "video"){
    el = document.createElement("video");
    el.loop = true; el.muted = true; el.playsInline = true; el.preload = "auto";
    el.src = url;
    el.addEventListener("loadedmetadata", () => reportMediaDuration(ref.key, el));
    el.addEventListener("seeked", () => { m.seeking = false; });
    el.addEventListener("loadeddata", () => { m.ready = true; });
  } else {
    el = new Image();
    el.addEventListener("load", () => { m.ready = true; });
    el.src = url;
  }
  m = {el, kind, ready: false, seeking: false, assetKey: ref.key, lastUsed: _mediaFrame};
  _mediaEls.set(cacheKey, m);
  return m;
}
function mediaAspect(m){
  const w = m.kind === "video" ? m.el.videoWidth : m.el.naturalWidth;
  const h = m.kind === "video" ? m.el.videoHeight : m.el.naturalHeight;
  return (w && h) ? w / h : 1;
}
function updateMediaPlayback(active, frozen){
  _mediaFrame++; evictUnusedMedia();
  const shouldPlay = !!(active && !frozen);
  for (const m of _mediaEls.values()){
    if (m.kind !== "video") continue;
    if (shouldPlay && m.el.paused) m.el.play().catch(() => {});
    else if (!shouldPlay && !m.el.paused) m.el.pause();
  }
  // Webcam streams (6) — same pause/resume as uploaded video on Freeze, now
  // that it's a live feed rather than a one-off still with nothing to
  // pause. Stop entirely isn't handled here: drawLayerWebcam already isn't
  // called at all while !active (see paintComposite), same as media/text.
  for (const s of _webcamStreams.values()){
    if (!s.video) continue;
    if (shouldPlay && s.video.paused) s.video.play().catch(() => {});
    else if (!shouldPlay && !s.video.paused) s.video.pause();
  }
}
// Grabs the live video frame into a small offscreen canvas ONCE per repaint
// (see index.html's getMediaFrame for the full rationale) so the triangle
// mesh's ~70 draws/shape/tick read a cheap already-rasterized bitmap
// instead of hitting the live <video> element that many times.
function getMediaFrame(m){

  const effResW = vp ? resW * vp.w : resW, effResH = vp ? resH * vp.h : resH;
  const scale = Math.min(w / effResW, h / effResH);
  const halfW = (effResW * scale) / 2, halfH = (effResH * scale) / 2;
  const cx0 = w / 2, cy0 = h / 2;
  const mapWin = (x, y) => {
    const [vx, vy] = applyViewport(x, y, filters.viewport);
    const [xk, yk] = applyKeystone(vx, vy, filters.keystoneH, filters.keystoneV);
    return [cx0 + xk * halfW, cy0 - yk * halfH];
  };
  if (testPattern){
    // Full brightness always, ignores master_gain/active — a calibration
    // aid should stay visible regardless of show state (Stop, a crossfade
    // dip, Disable Visuals); only flip (applied at the very end, same as
    // real content) matters here, since it's a physical-orientation fix.
    drawTestPattern(tctx, w, h, mapWin, outputId);
    cx.save();
    cx.globalCompositeOperation = "source-over"; cx.globalAlpha = 1; cx.filter = "none";
    cx.drawImage(scratch, 0, 0);
    cx.restore();
    if (filters.flipX || filters.flipY) applyFlip(cx, cv, filters.flipX, filters.flipY);
    if (showFps) drawFpsOverlay(cx, updateFpsCounter());
    return;
  }
  if (layers && layers.length){
    // Paint order (3): highest z-index first (furthest back), lowest last
    // (furthest front) — matches the editor's stacking exactly.
    const ordered = [...layers].sort((a, b) => (b.z_index ?? 5) - (a.z_index ?? 5));
    ordered.forEach(layer => {
      const opacity = layer.opacity ?? 1;   // gain applied once at the end, not here
      tctx.filter = "none";
      if (layer.source_type === "knockout"){
        // Excluded on purpose — see index.html's identical comment: a
        // knockout is a boolean mask (pure opaque black), and contrast <1
        // would lift black toward grey through Canvas2D's own filter formula.
        drawKnockoutFill(tctx, layer, mapWin, opacity);
        return;
      }
      // Filters (5/2) — see index.html's paintCanvasEditor for the full
      // rationale; layer.brightness/contrast/hue/saturation/colourize_* come
      // straight off the broadcast (composite.py's per-poly overrides), not
      // recomputed here.
      tctx.filter = buildCssFilter(layer);
      if (layer.source_type === "media"){
        // Real output stays fully black on Stop, same as vector scenes
        // (empty frame) — a media layer would otherwise keep showing its
        // last frame regardless of active, since it isn't scene-clock-driven.
        if (active) { drawLayerMedia(tctx, layer, mapWin, opacity); applyMirrorFoldPost(tctx, layer, mapWin); }
        return;
      }
      if (layer.source_type === "webcam"){
        if (active) { drawLayerWebcam(tctx, layer, mapWin, opacity); applyMirrorFoldPost(tctx, layer, mapWin); }
        return;
      }
      if (layer.source_type === "text"){
        if (active) { drawLayerText(tctx, layer, mapWin, opacity); applyMirrorFoldPost(tctx, layer, mapWin); }
        return;
      }
      if (!layer.strokes || !layer.strokes.length) return;
      const H = homography(layer.corners);
      const fitMode = layer.fit || "stretch";
      const ca = parseAspectRatio(layer.aspect), qa = quadAspect(layer.corners, mapWin);
      if (polyClipActive(layer)) {
        drawClippedStrokes(tctx, w, h, layer, H, mapWin, opacity, fitMode, ca, qa);
      } else if (fitMode === "crop") {
        tctx.save();
        clipToQuadPath(tctx, layer.corners, mapWin);
        drawWarpedStrokes(tctx, w, h, layer, H, mapWin, opacity, fitMode, ca, qa);
        tctx.restore();
      } else {
        drawWarpedStrokes(tctx, w, h, layer, H, mapWin, opacity, fitMode, ca, qa);
      }
      applyMirrorFoldPost(tctx, layer, mapWin);
    });
  }
  tctx.shadowBlur = 0;
  tctx.filter = "none";
  // Single blit, single alpha (8) — the actual master-gain fade, applied
  // once to the finished frame rather than per-triangle (see the comment
  // above getScratchCanvas).
  cx.save();
  cx.globalCompositeOperation = "source-over";
  cx.globalAlpha = 1;
  cx.filter = "none";
  cx.fillStyle = "#000";
  cx.fillRect(0, 0, w, h);
  cx.globalAlpha = gain;
  cx.drawImage(scratch, 0, 0);
  cx.restore();
  if (filters.flipX || filters.flipY) applyFlip(cx, cv, filters.flipX, filters.flipY);
  if (showFps) drawFpsOverlay(cx, updateFpsCounter());
}

// FPS overlay (Project tab > show output FPS) — a calibration/diagnostic
// aid, drawn AFTER applyFlip in fixed screen coordinates so it's always
// upright and readable regardless of this output's own physical-orientation
// flip. Measures wall-clock time between paintComposite calls, i.e. the
// actual end-to-end delivery rate reaching THIS window (server render rate
// + network + this browser's own paint) — not a claimed/target rate.
let _lastFrameTime = null, _fpsEma = 0;
function updateFpsCounter(){
  const now = performance.now();
  if (_lastFrameTime !== null){
    const dt = now - _lastFrameTime;
    if (dt > 0) _fpsEma = _fpsEma ? _fpsEma * 0.9 + (1000 / dt) * 0.1 : 1000 / dt;
  }
  _lastFrameTime = now;
  return _fpsEma;
}
function drawFpsOverlay(ctx, fps){
  const text = `${fps.toFixed(1)} fps`;
  ctx.save();
  ctx.font = "14px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace";
  const pad = 6, tw = ctx.measureText(text).width;
  ctx.fillStyle = "rgba(0,0,0,.6)";
  ctx.fillRect(8, 8, tw + pad * 2, 22);
  ctx.fillStyle = "#33e0d0";
  ctx.textBaseline = "middle";
  ctx.fillText(text, 8 + pad, 8 + 11);
  ctx.restore();
}

let ws = null;
function connect(){
  ws = new WebSocket(`ws://${location.host}/ws?hq=1`);
  ws.onopen = () => statusEl.classList.remove("show");
  ws.onclose = () => { statusEl.classList.add("show"); setTimeout(connect, 1000); };
  ws.onerror = () => ws.close();
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type !== "state") return;
    // Resolution lives on the project (ProjectSpec), not the canvas — every
    // canvas in a project's sequencer shares one output resolution.
    const active = !!(m.state && m.state.active);
    updateMediaPlayback(active, m.state && m.state.frozen);
    applyOutputFilters(m.state);
    const tp = !!(m.state && m.state.test_pattern && m.state.test_pattern[(+outputId || 1) - 1]);
    paintComposite(m.composite, (m.state && m.state.project_width) || 1920,
                    (m.state && m.state.project_height) || 1080,
                    m.state && m.state.master_gain, active, tp,
                    !!(m.state && m.state.show_fps));
  };
}
connect();
</script>
