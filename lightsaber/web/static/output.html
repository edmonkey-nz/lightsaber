<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lightsaber — Output</title>
<link rel="icon" type="image/png" href="/static/lightsaber.png">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;
            cursor:none}
  canvas{display:block;width:100vw;height:100vh}
  #hint{position:fixed;left:0;right:0;bottom:24px;text-align:center;
        font:13px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#5a5f6b;
        opacity:1;transition:opacity 1.5s ease-out;pointer-events:none;user-select:none}
  #hint.gone{opacity:0}
  #status{position:fixed;left:0;right:0;top:24px;text-align:center;
          font:13px ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#a04040;
          display:none;pointer-events:none;user-select:none}
  #status.show{display:block}
</style>
</head>
<body>
<canvas id="out"></canvas>
<div id="hint">Lightsaber output — drag this window to your projector/second screen, then press F11 for fullscreen</div>
<div id="status">disconnected — retrying…</div>
<script>
const cv = document.getElementById("out"), cx = cv.getContext("2d");
const statusEl = document.getElementById("status");
const hintEl = document.getElementById("hint");

// ResizeObserver, not just a window "resize" listener (4) — a real popped-
// out window always fires "resize" on its own resizes, but this page is now
// ALSO embedded in a small <iframe> (the control page's output-preview
// panel — see isPreview below): an iframe whose parent tab starts
// display:none has a 0×0 layout box at load, and switching that tab back to
// visible doesn't reliably fire the iframe's own "resize" event in every
// browser, leaving cv.width/height stuck at 0 forever (drawImage then
// throws on a 0-sized source). ResizeObserver fires for ANY box-size
// change, ancestor-visibility-driven or not — same fix as index.html's
// cv-edit already uses for its own equivalent embedding-in-a-tab problem.
function resize(){
  const dpr = window.devicePixelRatio || 1;
  const w = Math.round(document.documentElement.clientWidth * dpr);
  const h = Math.round(document.documentElement.clientHeight * dpr);
  if (w > 0 && h > 0 && (cv.width !== w || cv.height !== h)){ cv.width = w; cv.height = h; }
}
new ResizeObserver(resize).observe(document.documentElement);
resize();

const outputId = new URLSearchParams(location.search).get("out") || "1";
// Preview mode (?preview=1) — the control page's own output-preview panel
// (Sequencer tab) embeds this exact page in a small <iframe> per output, so
// it always shows precisely what that output is doing (flip/keystone/test
// pattern all included, for free) without a second render implementation.
// The "drag this window…" hint only makes sense for a real popped-out
// window, so skip it outright here instead of just letting it fade.
const isPreview = new URLSearchParams(location.search).get("preview") === "1";
document.title = `Lightsaber — Output ${outputId}`;
if (isPreview){
  hintEl.remove();
} else {
  setTimeout(() => hintEl.classList.add("gone"), 4000);
  hintEl.textContent = `Lightsaber output ${outputId} — drag this window to your projector/second screen, then press F11 for fullscreen`;
}

// Monitor-only visual filters — pure canvas rendering, no effect on the
// vector data. glow/trail/mirror are per-POLYGON now (see composite.py's
// overrides, carried on each layer in the composite payload itself), not a
// window-level setting read from here any more. flip is different: a
// per-OUTPUT-MONITOR physical-orientation setting, keyed by this window's
// own `?out=` id, that has nothing to do with any scene/polygon. Lives on
// the PROJECT now (Project tab > Output monitors — see projects.py's
// OutputMonitorConfig), not browser localStorage: a rig's physical
// orientation belongs to the show, and needs to reach this window
// regardless of which browser/machine opened it, not just tabs sharing one
// browser's storage. Updated from the SAME state broadcast that drives
// paintComposite (see the ws.onmessage handler below), not a separate poll.
// Viewport (a crop rect into the full canvas, [0,1] fractions, top-left
// origin — see projects.py's OutputMonitorConfig) — which slice of the
// canvas THIS output shows, for a wide multi-projector canvas sliced across
// several physical outputs (see ARCHITECTURE.md's render-host topology).
// Only applied when state.viewports_enabled is true; otherwise every
// output always shows the full canvas, unconditionally — the original
// behaviour, still the default even on projects that have viewport values
// sitting on them from before this existed. duplicate_of resolves to
// ANOTHER output's viewport (not this one's own) — flip/keystone above
// stay independent regardless, only the crop rect is shared.
const filters = { flipX: false, flipY: false, keystoneH: 0, keystoneV: 0, viewport: null,
                  blend: null };
// Edge blending. `edge_overlap` is the width of the physical band two
// neighbouring projectors both light, as a fraction of ONE output's width;
// each of the two extends half that band past the nominal seam, so together
// they cover a strip each fades across. Extending the VIEWPORT (rather than
// feathering inside the authored crop) is what makes this correct: feathering
// inside would just dim the last few percent of each output and leave a dark
// stripe down the join.
//
// Which edges extend is explicit per output (overlap_left/right/top/bottom),
// never inferred from whether two viewports happen to abut — projectors don't
// always sit edge to edge, and guessing wrong fades content to black against
// nothing.
function resolveViewport(outputs, index, edgeOverlap){
  let cfg = outputs[index], guard = 0;
  while (cfg && cfg.duplicate_of != null && guard++ < 8) cfg = outputs[cfg.duplicate_of];
  if (!cfg) return null;
  const x = cfg.viewport_x ?? 0, y = cfg.viewport_y ?? 0;
  const w = cfg.viewport_w ?? 1, h = cfg.viewport_h ?? 1;
  const f = Math.max(0, Math.min(0.5, edgeOverlap || 0));
  if (!f) return {x, y, w, h};
  // Half-bands, computed from the AUTHORED size so extending one edge can't
  // feed back into the other's width.
  const hx = (f * w) / 2, hy = (f * h) / 2;
  const L = !!cfg.overlap_left, R = !!cfg.overlap_right;
  const T = !!cfg.overlap_top,  B = !!cfg.overlap_bottom;
  return {
    x: x - (L ? hx : 0),
    y: y - (T ? hy : 0),
    w: w + (L ? hx : 0) + (R ? hx : 0),
    h: h + (T ? hy : 0) + (B ? hy : 0),
  };
}
// The feather bands, expressed as a fraction of the EXPANDED viewport, so
// they can be turned into device pixels against the letterboxed content rect.
function resolveBlend(outputs, index, edgeOverlap){
  let cfg = outputs[index], guard = 0;
  while (cfg && cfg.duplicate_of != null && guard++ < 8) cfg = outputs[cfg.duplicate_of];
  const f = Math.max(0, Math.min(0.5, edgeOverlap || 0));
  if (!cfg || !f) return null;
  const L = !!cfg.overlap_left, R = !!cfg.overlap_right;
  const T = !!cfg.overlap_top,  B = !!cfg.overlap_bottom;
  if (!L && !R && !T && !B) return null;
  const w = cfg.viewport_w ?? 1, h = cfg.viewport_h ?? 1;
  const hx = (f * w) / 2, hy = (f * h) / 2;
  const w2 = w + (L ? hx : 0) + (R ? hx : 0);
  const h2 = h + (T ? hy : 0) + (B ? hy : 0);
  // A full band is 2 half-bands wide: this output's extension plus the same
  // distance back inside its own nominal area, which is what its neighbour
  // is extending across.
  return {
    left:   L ? (2 * hx) / w2 : 0,
    right:  R ? (2 * hx) / w2 : 0,
    top:    T ? (2 * hy) / h2 : 0,
    bottom: B ? (2 * hy) / h2 : 0,
  };
}
function applyOutputFilters(state){
  const outputs = (state && state.outputs) || [];
  const idx = (+outputId || 1) - 1;
  const cfg = outputs[idx] || {};
  filters.flipX = !!cfg.flip_x;
  filters.flipY = !!cfg.flip_y;
  filters.keystoneH = cfg.keystone_h ?? 0;
  filters.keystoneV = cfg.keystone_v ?? 0;
  const vpOn = !!(state && state.viewports_enabled);
  const ov = vpOn ? (state.edge_overlap || 0) : 0;
  filters.viewport = vpOn ? resolveViewport(outputs, idx, ov) : null;
  filters.blend = vpOn ? resolveBlend(outputs, idx, ov) : null;
}
// Multiplies the finished frame down to black across each feathered edge.
// `multiply` rather than an alpha ramp because this models light, not
// transparency: two projectors overlapping add their output, so each has to
// fall off in brightness and the pair sum back to one.
//
// smoothstep is used for the falloff precisely because S(t) + S(1-t) = 1 —
// the two neighbours' ramps are exact complements, so the shared band comes
// out at full brightness with no seam. (A linear ramp is also complementary,
// but lands a visible crease at each end of the band.)
const BLEND_STOPS = 12;
function smoothstep(t){ return t * t * (3 - 2 * t); }
function applyEdgeBlend(ctx, w, h, blend, cx0, cy0, halfW, halfH){
  if (!blend) return;
  const left = cx0 - halfW, right = cx0 + halfW;
  const top = cy0 - halfH, bottom = cy0 + halfH;
  const contentW = halfW * 2, contentH = halfH * 2;
  // Each pass multiplies, so several edges compose without extra work.
  const bands = [
    blend.left   ? {horiz: true,  from: left,   to: left + blend.left * contentW} : null,
    blend.right  ? {horiz: true,  from: right,  to: right - blend.right * contentW} : null,
    blend.top    ? {horiz: false, from: top,    to: top + blend.top * contentH} : null,
    blend.bottom ? {horiz: false, from: bottom, to: bottom - blend.bottom * contentH} : null,
  ].filter(Boolean);
  if (!bands.length) return;
  ctx.save();
  ctx.globalCompositeOperation = "multiply";
  ctx.globalAlpha = 1;
  ctx.filter = "none";
  for (const b of bands){
    // Gradient runs from the outer edge (black) inward to full brightness.
    const g = b.horiz
      ? ctx.createLinearGradient(b.from, 0, b.to, 0)
      : ctx.createLinearGradient(0, b.from, 0, b.to);
    for (let i = 0; i <= BLEND_STOPS; i++){
      const t = i / BLEND_STOPS;
      const v = Math.round(255 * smoothstep(t));
      g.addColorStop(t, `rgb(${v},${v},${v})`);
    }
    // White past the band's inner end so the rest of the frame is untouched
    // by the multiply.
    g.addColorStop(1, "rgb(255,255,255)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }
  ctx.restore();
}
// Remaps a normalized [-1,1] (Y-up) canvas coordinate so the viewport rect
// fills the whole [-1,1] range instead of the full canvas — everything
// outside the viewport lands outside [-1,1] and is naturally clipped by the
// canvas element's own bounds (nothing special needed for that part).
function applyViewport(x, y, vp){
  if (!vp) return [x, y];
  const fx = (x + 1) / 2, fy = (1 - y) / 2;
  const mfx = (fx - vp.x) / vp.w, mfy = (fy - vp.y) / vp.h;
  return [mfx * 2 - 1, 1 - mfy * 2];
}

// Per-output-monitor keystone correction — display-only, this window's own
// physical-mount compensation (Project tab > Output monitors).
function applyKeystone(x, y, kh, kv){
  const xk = x * (1 + kh * y);
  const yk = y * (1 + kv * xk);
  // Deliberately NOT clamped to [-1,1] (40). Clamping a COORDINATE doesn't
  // crop anything — it collapses off-screen geometry onto the edge, which
  // silently corrupts the shape it belongs to. Worst on the parallelogram
  // fast path in drawMediaWarped, where the destination affine is derived
  // from just three corners: clamp one of them and the entire texture is
  // squeezed into the visible area. That's why a text shape spanning two
  // projectors drew the whole word on BOTH outputs at different scales
  // instead of one half on each.
  //
  // Anything outside [-1,1] is simply outside this output's slice and gets
  // clipped by the canvas raster for free, which is the correct behaviour —
  // and is now routine, since shape corners may legitimately sit past the
  // canvas edge (19).
  return [xk, yk];
}

// Reverses the WHOLE image, no reflection — the per-output-monitor "flip"
// (Project tab > Output monitors). Unlike per-polygon mirror (a same-shape
// axis flip applied to each layer's own strokes before warping, see
// paintComposite), this runs the finished composited frame through a
// physical-orientation correction for this specific screen.
function applyFlip(ctx, canvas, flipX, flipY){
  const w = canvas.width, h = canvas.height;
  ctx.save();
  ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = "source-over";
  ctx.translate(flipX ? w : 0, flipY ? h : 0);
  ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
  ctx.drawImage(canvas, 0, 0, w, h);
  ctx.restore();
}

// Unit-square->quad homography — identical to index.html's canvas editor
// (see its comment for the derivation); kept in sync so this window warps
// each polygon exactly the way the editor previews it.
function homography(corners){
  const [[x0,y0],[x1,y1],[x2,y2],[x3,y3]] = corners;
  const dx1=x1-x2, dy1=y1-y2, dx2=x3-x2, dy2=y3-y2;
  const sx=x0-x1+x2-x3, sy=y0-y1+y2-y3;
  const den = dx1*dy2 - dx2*dy1;
  const g = den ? (sx*dy2 - dx2*sy)/den : 0;
  const h = den ? (dx1*sy - sx*dy1)/den : 0;
  return { a: x1-x0+g*x1, b: x3-x0+h*x3, c: x0, d: y1-y0+g*y1, e: y3-y0+h*y3, f: y0, g, h };
}
function applyHomography(H, gx, gy){
  const u = (gx+1)/2, v = (1-gy)/2;
  const W = H.g*u + H.h*v + 1;
  return W ? [(H.a*u+H.b*v+H.c)/W, (H.d*u+H.e*v+H.f)/W] : [H.a*u+H.b*v+H.c, H.d*u+H.e*v+H.f];
}

function polygonBBoxPx(corners, mapWin){
  const pts = corners.map(c => mapWin(c[0], c[1]));
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  return {
    cx: (Math.min(...xs)+Math.max(...xs))/2, cy: (Math.min(...ys)+Math.max(...ys))/2,
    rx: Math.max(1,(Math.max(...xs)-Math.min(...xs))/2), ry: Math.max(1,(Math.max(...ys)-Math.min(...ys))/2),
  };
}

// Viewport culling. With viewports enabled each output shows only its own
// slice of a wider canvas, but the crop is a coordinate remap inside mapWin
// (see applyViewport) — so a shape belonging to a DIFFERENT projector still
// ran the whole path here and was only thrown away by the canvas edge at
// rasterization time. On a 4-output rig that meant every window decoded and
// mesh-warped every video: 4x the decoders and 4x the triangle work for 1x
// the picture. Measured: 4 outputs x 10 distorted 1080p layers ran at ~2fps
// with everything drawn everywhere.
//
// The corner quad is a sound conservative bound for media/webcam: "stretch"
// draws exactly the quad, "fit" draws inside it, and "crop" (which does
// generate geometry beyond the corners) clips back to the quad, as do
// polyClipActive and applyMirrorFoldPost. So if the quad's window-space
// bbox misses the window, nothing this layer draws could have landed.
//
// Culling also stops getMediaEl being called, so evictUnusedMedia releases
// the decoder a few seconds later and the video genuinely stops decoding in
// windows that can't see it. It reloads on demand if the shape moves back
// into this slice.
const _CULL_MARGIN_PX = 2;
function quadOffScreen(corners, mapWin, w, h){
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const c of corners){
    const [X, Y] = mapWin(c[0], c[1]);
    // A degenerate/inverted homography can divide through ~0 and produce
    // non-finite corners; never cull on garbage, just draw and let the
    // rasterizer sort it out.
    if (!Number.isFinite(X) || !Number.isFinite(Y)) return false;
    if (X < minX) minX = X;
    if (X > maxX) maxX = X;
    if (Y < minY) minY = Y;
    if (Y > maxY) maxY = Y;
  }
  const m = _CULL_MARGIN_PX;
  return maxX < -m || minX > w + m || maxY < -m || minY > h + m;
}

// Shape fit (1) — identical maths to index.html's canvas editor; see its
// comment for the derivation. Only difference here is quadAspect uses this
// window's own letterboxed mapWin instead of a plain square normToPx.
function parseAspectRatio(str){
  const m = /^(\d+(?:\.\d+)?):(\d+(?:\.\d+)?)$/.exec(String(str||"").trim());
  if (!m) return 1;
  const w = parseFloat(m[1]), h = parseFloat(m[2]);
  return h > 0 ? w/h : 1;
}
function quadAspect(corners, mapWin){
  const pts = corners.map(c => mapWin(c[0], c[1]));
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  const qw = Math.max(...xs)-Math.min(...xs), qh = Math.max(...ys)-Math.min(...ys);
  return qh > 0 ? qw/qh : 1;
}
function fitPoint(gx, gy, mode, ca, qa){
  if (mode === "fit"){
    return ca >= qa ? [gx, gy * (qa/ca)] : [gx * (ca/qa), gy];
  }
  if (mode === "crop"){
    return ca >= qa ? [gx * (ca/qa), gy] : [gx, gy * (qa/ca)];
  }
  return [gx, gy];
}
function clipToQuadPath(ctx, corners, mapWin){
  ctx.beginPath();
  corners.forEach((c,i) => { const [X,Y]=mapWin(c[0],c[1]); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
  ctx.closePath();
  ctx.clip();
}
// `uniform` (44) keeps a preset's own proportions instead of stretching it
// to the quad's bounding box — the smaller half-axis is used for both, so a
// circle really is round on a 2:1 shape rather than an ellipse.
function clipShapePath(ctx, shape, cx, cy, rx, ry, uniform){
  if (uniform){ const r = Math.min(rx, ry); rx = r; ry = r; }
  ctx.beginPath();
  if (shape === "circle") {
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
  } else if (shape === "square") {
    ctx.rect(cx-rx, cy-ry, rx*2, ry*2);
  } else if (shape === "triangle") {
    ctx.moveTo(cx, cy-ry); ctx.lineTo(cx+rx, cy+ry); ctx.lineTo(cx-rx, cy+ry); ctx.closePath();
  } else if (shape === "hexagon") {
    for (let i=0;i<6;i++){
      const a = -Math.PI/2 + i*Math.PI/3;
      const x = cx+rx*Math.cos(a), y = cy+ry*Math.sin(a);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath();
  }
}

// Custom mask (8) — clip_shape="custom"'s point list, in the quad's own UV
// space ([0,1]^2). Mapped through the same homography as the content, so
// the silhouette warps with the corner pins instead of sitting still in
// screen space. Mirrors index.html's block of the same name — see there,
// and PolygonSpec.clip_points, for the full rationale.
const CLIP_PRESETS = ["circle", "hexagon", "triangle", "square"];
const DEFAULT_CLIP_POINTS = [[0,0],[1,0],[1,1],[0,1]];
function polyClipPoints(layer){
  const pts = layer.clip_points;
  return (Array.isArray(pts) && pts.length >= 3) ? pts : DEFAULT_CLIP_POINTS;
}
function hasCustomMask(layer){
  return layer.clip_shape === "custom" && (layer.corners || []).length === 4;
}
function customMaskPath(ctx, layer, H, mapWin){
  ctx.beginPath();
  polyClipPoints(layer).forEach((p, i) => {
    const [nx, ny] = applyHomography(H, p[0]*2-1, 1-p[1]*2);
    const [X, Y] = mapWin(nx, ny);
    i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
  });
  ctx.closePath();
}
// Feather — how far a shape's mask/cutout edge ramps, authored in PROJECT-
// CANVAS pixels so the same number means the same thing in the editor
// preview and in a window of any size. _featherScale converts to THIS
// window's pixels and is set once per paint (see paintComposite).
//
// The conversion has to be explicit because Canvas2D's blur filter is a
// device-pixel measurement: it is applied to the rasterised result and
// measurably ignores the current transform, so a blur inside a scaled
// context does NOT scale with it.
let _featherScale = 1;
function featherPx(l){ return Math.max(0, Math.min(20, l.feather ?? 0)); }
function featherDevicePx(l){ const f = featherPx(l); return f > 0 ? f * _featherScale : 0; }

// Set only while a layer is being drawn into a feather buffer. The blurred
// mask below does the masking in that pass, so the hard clip has to stand
// aside: clipping first would cut the content off dead on the mask edge,
// leaving the outer half of the feather ramp with nothing to fade out.
let _featherPass = false;

// Chroma / luma key (see canvases.py's key_mode) — ONE SVG filter pass over
// a shape's already-warped side buffer. `ctx.filter` takes an SVG url(), so
// the whole keyer is declarative and GPU-accelerated: no WebGL context, no
// per-pixel JS, and it rides the same filter mechanism buildCssFilter uses.
//
// The filter element is built once and its attributes rewritten immediately
// before each keyed shape draws, so twenty keyed shapes still cost exactly
// one element. Draws are sequential, so there is no interleaving hazard.
//
// Two things the chain has to get right, both of which cost a rewrite to
// discover:
//   * The matte is computed on a branch straight off SourceGraphic, NOT off
//     the spill-suppressed colour — suppressing the key hue first stops the
//     key colour reading as key at all.
//   * That branch zeroes its own RGB and is only ever used for its alpha.
//     Driving alpha to 0 on the COLOUR branch would destroy the colour
//     (the pipeline is premultiplied) and raising alpha again afterwards
//     cannot bring it back: every kept pixel comes out black.
const KEY_FILTER_ID = "ls-key";
let _keyFilterEls = null;
function ensureKeyFilter(){
  if (_keyFilterEls) return _keyFilterEls;
  const host = document.createElement("div");
  host.style.cssText = "position:absolute;width:0;height:0;overflow:hidden";
  // color-interpolation-filters="sRGB" is required: filters default to
  // linear light, which would silently skew every matrix below.
  host.innerHTML = `
    <svg width="0" height="0"><defs>
      <filter id="${KEY_FILTER_ID}" color-interpolation-filters="sRGB"
              x="0%" y="0%" width="100%" height="100%">
        <feColorMatrix id="${KEY_FILTER_ID}-mean" type="matrix" in="SourceGraphic" result="mean"/>
        <feBlend in="SourceGraphic" in2="mean" mode="darken" result="dark"/>
        <feComposite id="${KEY_FILTER_ID}-mix" in="dark" in2="SourceGraphic"
                     operator="arithmetic" k1="0" k2="0" k3="1" k4="0" result="rgb"/>
        <feColorMatrix id="${KEY_FILTER_ID}-matte" type="matrix" in="SourceGraphic" result="k"/>
        <feComponentTransfer in="k" result="ramped">
          <feFuncA id="${KEY_FILTER_ID}-ramp" type="linear" slope="1" intercept="0"/>
        </feComponentTransfer>
        <feGaussianBlur id="${KEY_FILTER_ID}-blur" in="ramped" stdDeviation="0" result="m"/>
        <feComposite in="rgb" in2="m" operator="in" result="keyed"/>
        <feColorMatrix id="${KEY_FILTER_ID}-view" type="matrix" in="keyed"/>
      </filter>
    </defs></svg>`;
  document.body.appendChild(host);
  const g = id => host.querySelector("#" + KEY_FILTER_ID + "-" + id);
  _keyFilterEls = {mean: g("mean"), mix: g("mix"), matte: g("matte"),
                   ramp: g("ramp"), blur: g("blur"), view: g("view")};
  return _keyFilterEls;
}
// w = 2k-1 on the hue-normalised key colour: the axis that peaks on the key
// hue and dips on everything else, so w.rgb reads as "how much like the key".
function keyWeights(hex){
  const n = parseInt(String(hex || "#00b140").slice(1), 16) || 0;
  let r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const m = Math.max(r, g, b) || 1;
  return [2 * (r / m) - 1, 2 * (g / m) - 1, 2 * (b / m) - 1];
}
// "key channel := mean of the other two", fed to feBlend mode="darken" so it
// can only ever pull that channel DOWN. A plain weighted blend would RAISE
// it on colours that have none of it — pure red picked up a green cast.
function spillMeanMatrix(hex){
  const n = parseInt(String(hex || "#00b140").slice(1), 16) || 0;
  const rgb = [n >> 16 & 255, n >> 8 & 255, n & 255];
  const ch = rgb.indexOf(Math.max(...rgb));

  ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.stroke();
  const c = mapWin(0,0), r = Math.min(w,h) * 0.06;
  ctx.beginPath(); ctx.arc(c[0],c[1],r,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(c[0]-r*1.5,c[1]); ctx.lineTo(c[0]+r*1.5,c[1]); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(c[0],c[1]-r*1.5); ctx.lineTo(c[0],c[1]+r*1.5); ctx.stroke();
  ctx.font = `bold ${Math.round(Math.min(w,h)*0.05)}px ui-monospace, "SF Mono", Menlo, Consolas, monospace`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(`OUTPUT ${outId}`, c[0], c[1] + r*2.4);
  const barColors = ["#fff","#ff0","#0ff","#0f0","#f0f","#f00","#00f","#000"];
  const barH = h * 0.08, bw = w / barColors.length;
  barColors.forEach((col,i) => { ctx.fillStyle = col; ctx.fillRect(i*bw, h-barH, bw, barH); });
  ctx.restore();
}
// THE monitor output (2): one Scene per canvas polygon, each warped into
// that polygon's quad and composited here — the only rendering path this
// window has now. Letterboxed to the canvas's own resolution/aspect —
// resW/resH is whatever's set in the editor's width/height fields — rather
// than assuming a square, so this window matches the editor 1:1.
function paintComposite(layers, resW, resH, masterGain, active, testPattern, showFps){
  const w = cv.width, h = cv.height;
  const scratch = getScratchCanvas(w, h), tctx = scratch.ctx;
  tctx.shadowBlur = 0;
  tctx.globalCompositeOperation = "source-over";
  // No single global "trail" setting any more (glow/trail are per-polygon
  // overrides now — see composite.py) — approximate the window-level
  // persistence fade with whichever active layer wants the most trail.
  // Lives on the scratch buffer now, not `cx` — see the comment above.
  const windowTrail = layers && layers.length ? Math.max(0, ...layers.map(l => l.trail || 0)) : 0;
  tctx.fillStyle = windowTrail > 0 ? `rgba(0,0,0,${(1 - windowTrail).toFixed(3)})` : "#000";
  tctx.fillRect(0, 0, w, h);
  const gain = masterGain ?? 1;
  // Letterbox against the CROPPED slice's own aspect ratio, not the full
  // canvas's (7/bug fix) — a 2048x768 canvas split into two 50%-width
  // viewports means each output is showing a 1024x768 (4:3-ish) region, and
  // must letterbox/scale as THAT shape to fill its own window cleanly.
  // Letterboxing against the full 2048x768 aspect instead (the original
  // bug) stretched/squashed every cropped output into the wrong shape,
  // because it fit the FULL wide aspect into the window and only then
  // remapped coordinates within that wrongly-shaped box.
  const vp = filters.viewport;
  const effResW = vp ? resW * vp.w : resW, effResH = vp ? resH * vp.h : resH;
  const scale = Math.min(w / effResW, h / effResH);
  _featherScale = scale;                  // canvas px -> this window's px
  const halfW = (effResW * scale) / 2, halfH = (effResH * scale) / 2;
  const cx0 = w / 2, cy0 = h / 2;
  const mapWin = (x, y) => {
    const [vx, vy] = applyViewport(x, y, filters.viewport);
    const [xk, yk] = applyKeystone(vx, vy, filters.keystoneH, filters.keystoneV);
    return [cx0 + xk * halfW, cy0 - yk * halfH];
  };
  if (testPattern){
    // Full brightness always, ignores master_gain/active — a calibration
    // aid should stay visible regardless of show state (Stop, a crossfade
    // dip, Disable Visuals); only flip (applied at the very end, same as
    // real content) matters here, since it's a physical-orientation fix.
    drawTestPattern(tctx, w, h, mapWin, outputId);
    cx.save();
    cx.globalCompositeOperation = "source-over"; cx.globalAlpha = 1; cx.filter = "none";
    cx.drawImage(scratch, 0, 0);
    cx.restore();
    if (filters.flipX || filters.flipY) applyFlip(cx, cv, filters.flipX, filters.flipY);
    if (showFps) drawFpsOverlay(cx, updateFpsCounter());
    return;
  }
  if (layers && layers.length){
    // Paint order (3): highest z-index first (furthest back), lowest last
    // (furthest front) — matches the editor's stacking exactly.
    const ordered = [...layers].sort((a, b) => (b.z_index ?? 5) - (a.z_index ?? 5));
    // One layer's content, into whichever surface it belongs on: the frame
    // buffer normally, a side buffer when a bounded punch-through cutout has
    // to erase this layer without touching the ones behind it. Takes the
    // canvas rather than its context because the mirror-fold post-pass reads
    // back from the surface it just drew into.
    const paintLayerContent = (surf, layer, opacity) => {
      const dst = surf.ctx;
      // Viewport culling (see quadOffScreen) — only the decoder-backed layer
      // types, where skipping is worth real hardware. Vector layers can draw
      // a glow well outside their quad, so their bbox isn't a safe bound.
      if ((layer.source_type === "media" || layer.source_type === "webcam")
          && quadOffScreen(layer.corners, mapWin, w, h)) return;
      // Filters (5/2) — see index.html's paintCanvasEditor for the full
      // rationale; layer.brightness/contrast/hue/saturation/colourize_* come
      // straight off the broadcast (composite.py's per-poly overrides), not
      // recomputed here.
      dst.filter = buildCssFilter(layer);
      if (layer.source_type === "media"){
        // Real output stays fully black on Stop, same as vector scenes
        // (empty frame) — a media layer would otherwise keep showing its
        // last frame regardless of active, since it isn't scene-clock-driven.
        if (active) { drawLayerMedia(dst, layer, mapWin, opacity); applyMirrorFoldPost(dst, layer, mapWin, surf); }
        return;
      }
      if (layer.source_type === "webcam"){
        if (active) { drawLayerWebcam(dst, layer, mapWin, opacity); applyMirrorFoldPost(dst, layer, mapWin, surf); }
        return;
      }
      if (layer.source_type === "text"){
        if (active) { drawLayerText(dst, layer, mapWin, opacity); applyMirrorFoldPost(dst, layer, mapWin, surf); }
        return;
      }
      if (!layer.strokes || !layer.strokes.length) return;
      const H = homography(layer.corners);
      const fitMode = layer.fit || "stretch";
      const ca = parseAspectRatio(layer.aspect), qa = quadAspect(layer.corners, mapWin);
      if (polyClipActive(layer)) {
        drawClippedStrokes(dst, w, h, layer, H, mapWin, opacity, fitMode, ca, qa);
      } else if (fitMode === "crop") {
        dst.save();
        clipToQuadPath(dst, layer.corners, mapWin);
        drawWarpedStrokes(dst, w, h, layer, H, mapWin, opacity, fitMode, ca, qa);
        dst.restore();
      } else {
        drawWarpedStrokes(dst, w, h, layer, H, mapWin, opacity, fitMode, ca, qa);
      }
      applyMirrorFoldPost(dst, layer, mapWin, surf);
    };
    // One layer, through its own feathered mask edge if it has one. The
    // content is drawn into a buffer with the hard clip suppressed (see
    // _featherPass) and then masked by ONE blurred fill of the same path via
    // destination-in — which is the whole cost of a feather: no per-shape
    // offscreen canvas, no blurring of the content itself. The ramp is
    // symmetric about the authored edge, so content bleeds up to ~feather px
    // outside the mask at falling alpha.
    const drawContentLayer = (surf, layer, opacity) => {
      const f = polyClipAuthored(layer) ? featherDevicePx(layer) : 0;
      // A key needs the same side buffer a feather does — it runs over the
      // WARPED pixels, which is what keeps per-pixel alpha out of the warp
      // mesh and its double-compositing skirts (see canvases.py's key_mode).
      const keyed = keyActive(layer);
      const kf = keyed ? keyFeatherDevicePx(layer) : 0;
      if (f <= 0.1 && !keyed){ paintLayerContent(surf, layer, opacity); return; }
      // Only this layer's own footprint is touched, not the whole frame. The
      // clear and the blit either side of a feather are full-frame operations
      // by default, and with several feathered layers that cost — not the
      // blur, which is flat in radius — is what dominates. Padded generously:
      // a CSS blur(N) has sigma N/2 and reaches ~3 sigma, and the mask itself
      // can sit outside the quad at clip_scale > 1.
      const bb = polygonBBoxPx(layer.corners, mapWin);
      const grow = Math.max(1, layer.clip_scale ?? 1);
      const pad = Math.max(f, kf) * 2 + 2;
      const bx = Math.max(0, Math.floor(bb.cx - bb.rx*grow - pad));
      const by = Math.max(0, Math.floor(bb.cy - bb.ry*grow - pad));
      const bw = Math.min(w, Math.ceil(bb.cx + bb.rx*grow + pad)) - bx;
      const bh = Math.min(h, Math.ceil(bb.cy + bb.ry*grow + pad)) - by;
      if (bw <= 0 || bh <= 0) return;              // entirely off-screen
      const fb = openBuffer(getFeatherCanvas(w, h), w, h, bx, by, bw, bh), fctx = fb.ctx;
      // The hard clip only stands aside for a FEATHER; a key on its own wants
      // the shape masked normally.
      _featherPass = f > 0.1;
      try { paintLayerContent(fb, layer, opacity); }
      finally { _featherPass = false; }
      if (keyed) applyKeyFilter(fb, layer, kf, false);   // matte view is editor-only
      if (f > 0.1){
        fctx.globalCompositeOperation = "destination-in";
        fctx.filter = `blur(${f.toFixed(2)}px)`;
        polyClipPath(fctx, layer, layer.corners, mapWin);
        fctx.fill();
        fctx.globalCompositeOperation = "source-over";
        fctx.filter = "none";
      }
      blitBuffer(surf.ctx, fb, bx, by, bw, bh);
    };
    // Bounded-depth punches (see punchBand) have to be applied to the layers
    // they cover as those layers are drawn, not when the cutout's own turn
    // comes round — by then the frame buffer has merged them with the layers
    // the punch is supposed to spare.
    //
    // Those layers are collected into RUNS rather than punched one at a
    // time: every layer a given set of punches covers, cut through together
    // as one stack. Punching layer by layer would be equivalent only while
    // the erase is fully opaque — a FEATHERED punch has a partial-alpha
    // ramp, and erasing 60% of two stacked layers separately leaves more
    // standing than erasing 60% of the two combined, which shows up as a
    // halo along the soft edge wherever punched layers overlap. Runs are
    // always contiguous in paint order: which punches cover a layer depends
    // only on its z, and the layers are already sorted by z.
    const bounded = ordered.filter(l => isPunchCutout(l) && !punchIsFullDepth(l))
                           .map((l, i) => ({layer: l, band: punchBand(l), key: i}));
    let run = null;                      // {key, hits, surf}
    const flushRun = () => {
      if (run && run.hits.length){
        run.hits.forEach(p => applyPunch(run.surf.ctx, p.layer, mapWin));
        blitBuffer(tctx, run.surf);
      }
      run = null;
    };
    const surfaceFor = z => {
      const hits = bounded.filter(p => z >= p.band.from && z <= p.band.to);
      const key = hits.map(p => p.key).join(",");
      if (run && run.key === key) return run.surf;
      flushRun();
      run = {key, hits, surf: hits.length ? openBuffer(getPunchCanvas(w, h), w, h) : scratch};
      return run.surf;
    };
    ordered.forEach(layer => {
      const opacity = layer.opacity ?? 1;   // gain applied once at the end, not here
      tctx.filter = "none";
      if (layer.source_type === "knockout"){
        // Both modes draw straight onto the frame buffer, so any open run of
        // punched layers has to land first or it would blit back over them.
        flushRun();
        // A punch draws nothing of its own: a full-depth one erases the
        // frame so far, right here in paint order; a bounded one has already
        // been applied to the runs inside its band.
        if (isPunchCutout(layer)){
          if (punchIsFullDepth(layer)) applyPunch(tctx, layer, mapWin);
          return;
        }
        // Excluded on purpose — see index.html's identical comment: a
        // knockout is a boolean mask (pure opaque black), and contrast <1
        // would lift black toward grey through Canvas2D's own filter formula.
        drawKnockoutFill(tctx, layer, mapWin, opacity);
        return;
      }
      drawContentLayer(surfaceFor(layer.z_index ?? 5), layer, opacity);
    });
    flushRun();
  }
  tctx.shadowBlur = 0;
  tctx.filter = "none";
  // Single blit, single alpha (8) — the actual master-gain fade, applied
  // once to the finished frame rather than per-triangle (see the comment
  // above getScratchCanvas).
  cx.save();
  cx.globalCompositeOperation = "source-over";
  cx.globalAlpha = 1;
  cx.filter = "none";
  cx.fillStyle = "#000";
  cx.fillRect(0, 0, w, h);
  cx.globalAlpha = gain;
  cx.drawImage(scratch, 0, 0);
  cx.restore();
  // Edge blend before flip: the falloff is authored in canvas space, and
  // flip is a physical-mount correction applied to the finished frame, so a
  // flipped projector's blend has to flip with it to land on the right
  // physical edge.
  applyEdgeBlend(cx, w, h, filters.blend, cx0, cy0, halfW, halfH);
  if (filters.flipX || filters.flipY) applyFlip(cx, cv, filters.flipX, filters.flipY);
  if (showFps) drawFpsOverlay(cx, updateFpsCounter());
}

// FPS overlay (Project tab > show output FPS) — a calibration/diagnostic
// aid, drawn AFTER applyFlip in fixed screen coordinates so it's always
// upright and readable regardless of this output's own physical-orientation
// flip. Measures wall-clock time between paintComposite calls, i.e. the
// actual end-to-end delivery rate reaching THIS window (server render rate
// + network + this browser's own paint) — not a claimed/target rate.
// Counts paints in a rolling one-second window (36). This was an EMA of the
// INSTANTANEOUS rate (1000/dt), which is badly biased upward by jitter:
// 1000/dt is convex, so occasional near-zero gaps dominate the average.
// Two websocket messages delivered back-to-back after a stall (a 1ms gap)
// inject 100 into the EMA in one step and it decays only slowly. Modelled:
// with 10% of frames arriving coalesced, a true 33.6 fps reads as 141.
// That's the reverse of what a frame-rate meter is for — it read HIGHEST
// exactly when the window was struggling, because struggling is what makes
// delivery bursty.
let _fpsStamps = [];
function updateFpsCounter(){
  const now = performance.now();
  _fpsStamps.push(now);
  while (_fpsStamps.length && now - _fpsStamps[0] > 1000) _fpsStamps.shift();
  return _fpsStamps.length;
}
function drawFpsOverlay(ctx, fps){
  const text = `${fps.toFixed(1)} fps`;
  ctx.save();
  ctx.font = "14px ui-monospace, \"SF Mono\", Menlo, Consolas, monospace";
  const pad = 6, tw = ctx.measureText(text).width;
  ctx.fillStyle = "rgba(0,0,0,.6)";
  ctx.fillRect(8, 8, tw + pad * 2, 22);
  ctx.fillStyle = "#33e0d0";
  ctx.textBaseline = "middle";
  ctx.fillText(text, 8 + pad, 8 + 11);
  ctx.restore();
}

let ws = null;
function connect(){
  ws = new WebSocket(`ws://${location.host}/ws?hq=1`);
  ws.onopen = () => statusEl.classList.remove("show");
  ws.onclose = () => { statusEl.classList.add("show"); setTimeout(connect, 1000); };
  ws.onerror = () => ws.close();
  // Paint is decoupled from delivery (36). Painting straight out of
  // onmessage means a burst of queued messages — which is exactly what a
  // busy window gets once the socket backlog flushes — becomes a burst of
  // full-canvas repaints of near-identical frames. That makes the stall
  // worse, which makes the next backlog bigger: a window that falls behind
  // is punished for it.
  //
  // Instead: keep only the newest state, paint on requestAnimationFrame,
  // and never faster than the project's own frame rate. Stale frames are
  // dropped rather than drawn, and rAF also stops us painting faster than
  // the display can actually show — a repaint between two refreshes is work
  // nobody ever sees.
  let _pending = null, _rafQueued = false, _lastPaintAt = 0;
  function drawPending(){
    _rafQueued = false;
    const m = _pending;
    if (!m) return;
    const targetFps = Math.max(1, (m.state && m.state.project_fps) || 30);
    const minPeriod = 1000 / targetFps;
    const now = performance.now();
    // 0.85 rather than 1.0: rAF lands on ~16.7ms boundaries, so demanding a
    // full period would quantise 30fps down to 30 -> 20 (two refreshes
    // become three). The slack lets it take the nearer refresh.
    if (now - _lastPaintAt < minPeriod * 0.85){
      _rafQueued = true;
      requestAnimationFrame(drawPending);      // keep the newest, try again
      return;
    }
    _pending = null;
    _lastPaintAt = now;
    // Resolution lives on the project (ProjectSpec), not the canvas — every
    // canvas in a project's sequencer shares one output resolution.
    const active = !!(m.state && m.state.active);
    updateMediaPlayback(active, m.state && m.state.frozen);
    applyOutputFilters(m.state);
    const tp = !!(m.state && m.state.test_pattern && m.state.test_pattern[(+outputId || 1) - 1]);
    paintComposite(m.composite, (m.state && m.state.project_width) || 1920,
                    (m.state && m.state.project_height) || 1080,
                    m.state && m.state.master_gain, active, tp,
                    !!(m.state && m.state.show_fps));
  }
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type !== "state") return;
    _pending = m;                               // newest wins; older ones are dropped
    if (_rafQueued) return;
    _rafQueued = true;
    requestAnimationFrame(drawPending);
  };
}
connect();
</script>
